<!-- ГОТОВЫЙ КОД: www.мягкиеокна55.рф → CRM + текущий Telegram оставляем -->

<script>
const CRM_LEAD_URL = 'https://ТВОЙ-CRM-ДОМЕН.vercel.app/api/site-lead';

async function sendLeadToCRM(lead) {
  const res = await fetch(CRM_LEAD_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: lead.name || '',
      phone: lead.phone || '',
      address: lead.address || '',
      message: lead.message || '',
      source: 'Сайт мягкиеокна55.рф'
    })
  });

  if (!res.ok) {
    console.error('CRM lead error:', await res.text());
    return false;
  }

  return true;
}

  phone: phone,
  address: address,
  message: message
});
*/
</script>
